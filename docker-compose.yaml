services:
  dashboard:
    build: . 
    container_name: dashboard-container
    restart: always
    environment:
      - PORT=2121
      - PUBLIC_URL=/dashboard/
      - MONGO_URL=mongodb://dashboard-mongo:27017/dashboardDB
      - DEFAULT_APP_USER=${DEFAULT_APP_USER}
      - DEFAULT_ADD_EMAIL=${DEFAULT_ADD_EMAIL}
      - DEFAULT_APP_PASSWORD=${DEFAULT_APP_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
    networks:
      - web-main-net

  dashboard-mongo:
      image: mongo:7
      restart: unless-stopped
      volumes:
        - mongo_data:/data/db
      expose:
        - "27017"
      networks: [ web-main-net ]

volumes:
  mongo_data: {}

networks:
  web-main-net:
    external: true