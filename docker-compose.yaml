services:
  dashboard:
    build: . 
    container_name: dashboard-container
    restart: on-failure
    environment:
      - PORT=2121
      - PUBLIC_URL=${PUBLIC_URL}
      - MONGO_URL=mongodb://dashboard-mongo:27017/dashboardDB
      - NODE_ENV=${NODE_ENV}
      - DEFAULT_APP_USER=${DEFAULT_APP_USER}
      - DEFAULT_ADD_EMAIL=${DEFAULT_ADD_EMAIL}
      - DEFAULT_APP_PASSWORD=${DEFAULT_APP_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    networks:
      - web-main-net
    ports:
      - "2121:2121"

  dashboard-mongo:
      image: mongo:7
      restart: unless-stopped
      volumes:
        - dashboard_mongo_data:/data/db
      expose:
        - "27017"
      networks: [ web-main-net ]

volumes:
  dashboard_mongo_data: {}

networks:
  web-main-net:
    external: true