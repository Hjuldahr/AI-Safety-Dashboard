openapi: 3.0.0
info:
  title: AI Safety Dashboard API
  description: API documentation for the AI Safety Dashboard project.
  version: 1.2.0
servers:
  - url: http://localhost:2121
    description: AI Dashboard - LocalHost
  - url: https://danielbierman.ca/dashboard
    description: AI Dashboard - DanielBierman.ca

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid

  schemas:
    # --- Mongoose Model Mirrors ---
    User:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        username:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
          default: ["viewer"]
        notificationsLastSeen:
          type: string
          format: date-time
          nullable: true
        preferredTheme:
          type: string
          enum: [default, ocean, sunset, viridian, sakura, cosmic, contrast, compact]
          default: default
        preferredColour:
          type: string
          enum: [light, dark, auto]
          default: auto
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Role:
      type: object
      required:
        - name
        - description
        - permissions
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        name:
          type: string
          description: Lowercase unique role name
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        isSystemRole:
          type: boolean
          description: Indicates if the role is a built-in system role
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Alert:
      type: object
      required:
        - alertName
        - alertLevel
        - alertRule
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        alertName:
          type: string
        modelName:
          type: string
          nullable: true
        alertLevel:
          type: string
          enum: [Critical, High, Medium, Info]
        alertRule:
          type: object
          description: 'MongoDB style query object (e.g. { "responseTimestamp": { "$gt": 100 } })'
          additionalProperties: true
        created:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
          description: ObjectId references to Tag
        disabled:
          type: boolean
          default: false
          description: Whether the alert is disabled
        muted:
          type: boolean
          default: false
          description: Whether the alert is muted (still logs but no notifications)

    AlertLog:
      type: object
      required:
        - alert
        - timestamp
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        alert:
          type: string
          description: ObjectId reference to the parent Alert
        alertSnapshot:
          type: object
          description: Snapshot of the alert configuration at the time of triggering
          properties:
            _id:
              type: string
            alertName:
              type: string
            alertLevel:
              type: string
            modelName:
              type: string
            alertRule:
              type: object
            created:
              type: string
              format: date-time
        tags:
          type: array
          items:
            type: string
          description: ObjectId references to HistoricalTag
        logs:
          type: array
          items:
            type: string
          description: ObjectId references to AI_Logs
        timestamp:
          type: string
          format: date-time

    ChartConfig:
      type: object
      required:
        - title
        - chartType
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        title:
          type: string
        chartType:
          type: string
          enum: [line, bar, pie, measure]
        chartSize:
          type: string
          enum: [tiny, regular, large, massive]
          default: regular
        order:
          type: number
          default: 9999
        yAxis:
          type: string
          nullable: true
        xAxis:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        splitBy:
          type: string
          nullable: true
        includedValues:
          type: array
          items:
            type: string
        chartTimeRange:
          type: string
          enum: ['10s', '30s', '1min', '5min', '15min', '1h', '1d', '1w', '1mo']
          default: '10s'
          description: Time range for chart data
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AILog:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        modelName:
          type: string
        policyCompliance:
          type: number
        responseHelpfulness:
          type: number
        responseTime:
          type: number
        energyConsumption:
          type: number
        tokensUsed:
          type: number
        gigaFlopsUsed:
          type: number
        webLookups:
          type: number
        toxicityScore:
          type: number
        piiDetected:
          type: number
        breakdown:
          type: object
          description: Summaries of Categorical Data
          additionalProperties: true
        queryCount:
          type: number
          default: 1
        responseTimestamp:
          type: number
          description: Unix timestamp (Number)
          example: 1709230000000

    UserLog:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        userID:
          type: string
          description: ObjectId reference to User
        eventType:
          type: string
          enum:
            - Login
            - Logout
            - Signup
            - User_Created
            - User_Deleted
            - User_Updated
            - Role_Created
            - Role_Deleted
            - Role_Changed
            - Setting_Changed
            - Alert_Created
            - Alert_Modified
            - Alert_Deleted
            - Report_Created
            - Report_Deleted
            - Chart_Created
            - Chart_Modified
            - Chart_Deleted
            - Unspecified_Event
        details:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        message:
          type: string
        category:
          type: string
          enum: [generic, alert, demo, user, server]
        redirectUrl:
          type: string
          nullable: true
        colour:
          type: string
          default: info
        timeout:
          type: number
          default: 3
        dismissible:
          type: boolean
          default: true
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReportRecord:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        title:
          type: string
        modelName:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        fields:
          type: array
          items:
            type: string
        fidelity:
          type: string
          enum: [high, low, split]
          default: high
        pdfFilename:
          type: string
        createdAt:
          type: string
          format: date-time

    ReportTemplate:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        name:
          type: string
        icon:
          type: string
          default: ''
        fields:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    SystemSetting:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        key:
          type: string
        value:
          description: Mixed type value
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

security:
  - cookieAuth: []

paths:
  # ============================
  # AUTH ROUTER
  # ============================
  /login:
    get:
      tags: [Auth, "HTML Page"]
      summary: Login Page
      description: Returns the HTML of the Login Page.
      responses:
        "200":
          description: HTML content for the Login Page.
          content:
            text/html:
              schema:
                type: string
              example: "<html>...</html>"

  /api/login:
    post:
      tags: [Auth]
      summary: User Login
      security: [] # Public endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Login successful
        401:
          description: Authentication failed

  /api/signup:
    post:
      tags: [Auth]
      summary: User Signup
      security: [] # Public endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        201:
          description: "User created"
        409:
          description: "User already exists"
        500:
          description: "An internal server error occurred."

  /api/logout:
    post:
      tags: [Auth]
      summary: Logout user
      responses:
        302:
          description: "Redirects to login page"
        500:
          description: "Logout failed"

  # ============================
  # INDEX / DASHBOARD ROUTER
  # ============================
  /:
    get:
      tags: [Dashboard, "HTML Page"]
      summary: Main Dashboard homepage
      description: Returns the HTML of the AI Safety Dashboard.
      responses:
        200:
          description: HTML content for the AI Safety Dashboard.
          content:
            text/html:
              schema:
                type: string
              example: "<html>...</html>"

  /api/recentData:
    get:
      tags: [Dashboard]
      summary: Get recent AI data and chart configs
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        $ref: "#/components/schemas/AILog"
                  configs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChartConfig"
        500:
          description: "Failed to fetch recent data."

  # ============================
  # ALERTS ROUTER
  # ============================
  /alerts:
    get:
      tags: [Alerts, "HTML Page"]
      summary: Alerts Page
      description: Returns the HTML of the Alerts Page.
      responses:
        "200":
          description: HTML content for the Alerts Page.
          content:
            text/html:
              schema:
                type: string
              example: "<html>...</html>"
    post:
      tags: [Alerts]
      summary: Create a new alert definition
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Alert"
      responses:
        201:
          description: Alert created
        400:
          description: Invalid alert rule
        500:
          description: An internal server error occurred.

  /alerts/live:
    get:
      tags: [Alerts]
      summary: Get all active alert definitions
      responses:
        200:
          description: List of alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Alert"
        500:
          description: Failed to fetch alerts.

  /alerts/api/history:
    get:
      tags: [Alerts]
      summary: Get paginated alert history logs
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: level
          schema:
            type: string
        - in: query
          name: modelName
          schema:
            type: string
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
      responses:
        200:
          description: Paginated history
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                  pages:
                    type: integer
        500:
          description: "Error fetching history."

  /alerts/api/log/{id}:
    get:
      tags: [Alerts]
      summary: Get a specific alert log entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Alert log entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertLog"
        404:
          description: Alert Log not found.
        500:
          description: Error fetching alert log.

  /alerts/api/aiLog/{id}:
    get:
      tags: [Alerts]
      summary: Get alerts associated with an AI log
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Array of alert logs for the given AI log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertLog"
        404:
          description: AI Log not found.
        500:
          description: Error fetching alerts for AI Log.

  /alerts/view/{id}:
    get:
      tags: [Alerts, "HTML Page"]
      summary: View a specific alert log entry page
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: HTML page deep-linking to the alert log entry
          content:
            text/html:
              schema:
                type: string
        302:
          description: Redirect to /alerts if not found

  /alerts/api/stats:
    get:
      tags: [Alerts]
      summary: Get alert statistics
      description: Returns level distribution and time series data for alerts.
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          description: Defaults to 24 hours before endDate
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          description: Defaults to now
      responses:
        200:
          description: Alert statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  levelDistribution:
                    type: object
                    properties:
                      Critical:
                        type: integer
                      High:
                        type: integer
                      Medium:
                        type: integer
                      Info:
                        type: integer
                  timeSeries:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          x:
                            type: string
                          y:
                            type: integer
        400:
          description: Invalid date range
        500:
          description: Error fetching statistics.

  /alerts/{id}:
    delete:
      tags: [Alerts]
      summary: Delete an alert by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Alert removed.
        400:
          description: Missing alert id.
        404:
          description: Alert not found.
        500:
          description: Failed to remove alert.
    put:
      tags: [Alerts]
      summary: Update an alert by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Alert"
      responses:
        200:
          description: Alert updated
        400:
          description: Missing alert id.
        404:
          description: Alert not found.
        500:
          description: Failed to update alert.

  /alerts/api/logs/{id}/tags:
    post:
      tags: [Alerts]
      summary: Add a tag to an alert log
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tagId:
                  type: string
                name:
                  type: string
                color:
                  type: string
      responses:
        200:
          description: Tag added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  tag:
                    type: object
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      color:
                        type: string
        404:
          description: Tag or alert log not found.
        500:
          description: Failed to add tag to alert log.
    put:
      tags: [Alerts]
      summary: Set all tags on an alert log
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: string
                  description: Array of active Tag IDs
      responses:
        200:
          description: Tags updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  tags:
                    type: array
                    items:
                      type: string
                    description: Array of HistoricalTag IDs
        404:
          description: Alert log not found.
        500:
          description: Failed to set tags.

  /alerts/api/logs/{id}/tags/{tagId}:
    delete:
      tags: [Alerts]
      summary: Remove a tag from an alert log
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: tagId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Tag removed from alert log.
        404:
          description: Alert log not found.
        500:
          description: Failed to remove tag.

  # ============================
  # LOG ROUTER
  # ============================
  /logs:
    get:
      tags: [Logs, "HTML Page"]
      summary: Logs Page
      description: Returns the HTML of the Logs Page.
      responses:
        "200":
          description: HTML content for the Logs Page.
          content:
            text/html:
              schema:
                type: string
              example: "<html>...</html>"

  /logs/api/user:
    get:
      tags: [Logs]
      summary: Get filtered user logs
      parameters:
        - in: query
          name: userID
          schema:
            type: string
        - in: query
          name: eventType
          schema:
            type: string
        - in: query
          name: startDate
          schema:
            type: string
        - in: query
          name: endDate
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
      responses:
        200:
          description: Paginated user logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserLog"
        500:
          description: Failed to fetch user logs.

  /logs/api/ai:
    get:
      tags: [Logs]
      summary: Get filtered AI logs
      parameters:
        - in: query
          name: modelName
          schema:
            type: string
        - in: query
          name: startDate
          schema:
            type: string
        - in: query
          name: endDate
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
      responses:
        200:
          description: Paginated AI logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: "#/components/schemas/AILog"
        500:
          description: Failed to fetch AI logs.

  /logs/api/user/export/csv:
    post:
      tags: [Logs]
      summary: Export User Logs to CSV
      responses:
        200:
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary
        500:
          description: Export User Log CSV Error.

  /logs/api/user/export/hdf5:
    post:
      tags: [Logs]
      summary: Export User Logs to HDF5
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                startDate:
                  type: string
                endDate:
                  type: string
                eventType:
                  type: string
      responses:
        200:
          description: HDF5 file download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        404:
          description: No user logs found.
        500:
          description: Export User Log HDF5 Error.

  /logs/api/ai/export/csv:
    post:
      tags: [Logs]
      summary: Export AI Logs to CSV
      responses:
        200:
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary
        500:
          description: Export AI Log CSV Error.

  /logs/api/ai/export/hdf5:
    post:
      tags: [Logs]
      summary: Export AI Logs to HDF5
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                startDate:
                  type: string
                endDate:
                  type: string
                modelName:
                  type: string
      responses:
        200:
          description: HDF5 file download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        404:
          description: No AI logs found.
        500:
          description: Export AI Log HDF5 Error.

  /logs/api/summary/export/csv:
    post:
      tags: [Logs]
      summary: Export AI Summaries to CSV
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                startDate:
                  type: string
                endDate:
                  type: string
                modelName:
                  type: string
      responses:
        200:
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary
        404:
          description: No AI summaries found.
        500:
          description: Export AI Summary CSV Error.

  /logs/api/summary/export/hdf5:
    post:
      tags: [Logs]
      summary: Export AI Summaries to HDF5
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                startDate:
                  type: string
                endDate:
                  type: string
                modelName:
                  type: string
      responses:
        200:
          description: HDF5 file download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        404:
          description: No AI summaries found.
        500:
          description: Export AI Summary HDF5 Error.

  # ============================
  # CONTROL PANEL ROUTER
  # ============================    
  /api/params:
    get:
      tags: [ControlPanel]
      summary: Get scheduler state parameters
      security: []
      responses:
        200:
          description: Scheduler state
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  state:
                    type: object
        500:
          description: Error fetching server state.
    patch:
      tags: [ControlPanel]
      summary: Update scheduler parameters
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: Updated successfully
        500:
          description: Error updating server state.
          
  # ============================
  # DASHBOARD
  # ============================        
  /api/graph:
    post:
      tags: [ControlPanel]
      summary: Create a new graph configuration
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartConfig"
      responses:
        201:
          description: Chart created
        400:
          description: Title and chartType are required.
        500:
          description: Failed to save chart config.
    put:
      tags: [ControlPanel]
      summary: Update an existing graph configuration
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    id:
                      type: string
                    newTitle:
                      type: string
                    newSize:
                      type: string
                - $ref: "#/components/schemas/ChartConfig"
      responses:
        200:
          description: Chart updated.
        404:
          description: Chart config not found.
        500:
          description: Server error while updating chart.
    delete:
      tags: [ControlPanel]
      summary: Delete a graph configuration
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
      responses:
        200:
          description: Chart deleted
        404:
          description: Chart not found.
        500:
          description: Server error while deleting chart.
    patch:
      tags: [ControlPanel]
      summary: Partial update to a graph configuration
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Chart config ID (required)
              additionalProperties: true
      responses:
        200:
          description: Chart config updated successfully.
        404:
          description: Chart config not found.
        500:
          description: Server error while updating chart.

  /api/getChartConfig/{id}:
    get:
      tags: [ControlPanel]
      summary: Get specific chart config
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Chart Config.
        404:
          description: Config not found.
        500:
          description: Server error while fetching config.

  /api/reorder:
    post:
      tags: [ControlPanel]
      summary: Reorder charts
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                newOrder:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
      responses:
        200:
          description: Order updated
        500:
          description: Failed to update order.

  # ============================
  # REPORT ROUTER
  # ============================
  /reports:
    get:
      tags: [Reports, "HTML Page"]
      summary: Reports Page
      description: Returns the HTML of the Reports Page.
      responses:
        "200":
          description: HTML content for the Reports Page.
          content:
            text/html:
              schema:
                type: string
              example: "<html>...</html>"
    post:
      tags: [Reports]
      summary: Generate a PDF Report
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reportTitle:
                  type: string
                  default: Dashboard Report
                startDate:
                  type: string
                endDate:
                  type: string
                modelName:
                  type: string
                fields:
                  type: array
                  items:
                    type: string
                  description: Metrics to include (e.g. responseTime, policyCompliance, appendixAiLogs)
      responses:
        200:
          description: PDF Report
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        500:
          description: Failed to generate report.

  /reports/download-logs:
    post:
      tags: [Reports]
      summary: Download raw AI logs CSV
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                modelName:
                  type: string
                startDate:
                  type: string
                endDate:
                  type: string
      responses:
        200:
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary
        404:
          description: No logs found for the selected criteria. The date range may be empty.
        500:
          description: Failed to generate CSV due to a server error.

  /reports/download-aggregates:
    post:
      tags: [Reports]
      summary: Download aggregated stats CSV
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                modelName:
                  type: string
                startDate:
                  type: string
                endDate:
                  type: string
      responses:
        200:
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary
        404:
          description: No data found to calculate aggregates.
        500:
          description: Failed to generate aggregate CSV due to a server error.

  /reports/download-summaries:
    post:
      tags: [Reports]
      summary: Download AI summaries CSV
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                modelName:
                  type: string
                startDate:
                  type: string
                endDate:
                  type: string
      responses:
        200:
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary
        404:
          description: No summaries found for the selected criteria.
        500:
          description: Summary export failed.

  /reports/download-hdf5:
    post:
      tags: [Reports]
      summary: Download data as HDF5
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                modelName:
                  type: string
                startDate:
                  type: string
                endDate:
                  type: string
      responses:
        200:
          description: HDF5 file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        404:
          description: No data found for the selected criteria.
        500:
          description: HDF5 generation failed.

  /reports/history:
    get:
      tags: [Reports]
      summary: Get paginated report history
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: Paginated report history
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReportRecord"
                  total:
                    type: integer
                  page:
                    type: integer
                  pages:
                    type: integer
        500:
          description: Failed to fetch report history.

  /reports/history/{id}/pdf:
    get:
      tags: [Reports]
      summary: Download a historical report PDF
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: PDF file download
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        404:
          description: Report or PDF file not found.
        500:
          description: Failed to retrieve PDF.

  /reports/history/{id}/download/{type}:
    get:
      tags: [Reports]
      summary: Download data from a historical report
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: type
          required: true
          schema:
            type: string
            enum: [logs, summaries, aggregates, hdf5]
      responses:
        200:
          description: File download (format varies by type)
        400:
          description: Unknown download type.
        404:
          description: Report not found.
        500:
          description: Failed to process download.

  /reports/history/{id}:
    delete:
      tags: [Reports]
      summary: Delete a report from history
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Report deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        404:
          description: Report not found.
        500:
          description: Failed to delete report.

  /reports/templates:
    get:
      tags: [Reports]
      summary: List report templates
      responses:
        200:
          description: Array of report templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReportTemplate"
        500:
          description: Failed to fetch templates.
    post:
      tags: [Reports]
      summary: Create a report template
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - fields
              properties:
                name:
                  type: string
                icon:
                  type: string
                fields:
                  type: array
                  items:
                    type: string
      responses:
        201:
          description: Template created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  template:
                    $ref: "#/components/schemas/ReportTemplate"
        400:
          description: Template name and at least one field are required.
        500:
          description: Failed to create template.

  /reports/templates/{id}:
    delete:
      tags: [Reports]
      summary: Delete a report template
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Template deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        404:
          description: Template not found.
        500:
          description: Failed to delete template.

  # ============================
  # DOCUMENTATION ROUTER
  # ============================
  /docs:
    get:
      tags: [Documentation, "HTML Page"]
      summary: Documentation Page
      description: Returns the HTML of the Documentation Page.
      responses:
