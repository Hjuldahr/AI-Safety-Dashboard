              type: object
              required:
                - modelName
              properties:
                modelName:
                  type: string
      responses:
        200:
          description: Scenario reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
