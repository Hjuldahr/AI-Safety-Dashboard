            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  message:
                    type: string
                  redirectUrl:
                    type: string
                    nullable: true
                  timeout:
                    type: number
                  dismissible:
                    type: boolean
                  trim:
                    type: string
                  background:
                    type: string
                  tags:
                    type: array
                    items:
                      type: object
        500:
          description: Error fetching latest notification.

  /notifications/unread:
    get:
      tags: [Notifications]
      summary: Get unread notification count
      responses:
        200:
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread:
                    type: integer
        500:
          description: Error fetching unread count.

  /notifications/history:
    get:
      tags: [Notifications]
