        - in: query
          name: tag
          schema:
            type: string
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
      responses:
        200:
          description: Paginated notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                  page:
                    type: integer
                  pages:
                    type: integer
                  limit:
                    type: integer
        500:
          description: Error fetching history.

  /notifications/mark-read:
    post:
      tags: [Notifications]
      summary: Mark all notifications as read
      responses:
        200:
          description: Marked read
        401:
          description: Not authenticated
        500:
          description: Failed to mark read.

