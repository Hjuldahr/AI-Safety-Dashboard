      responses:
        200:
          description: HTML content for the Component Library.
          content:
            text/html:
              schema:
                type: string

  # ============================
  # SSE / SCHEDULER ROUTER
  # ============================
  /events:
    get:
      tags: [SSE]
      summary: Server-Sent Events stream
      description: >
        Opens a persistent SSE connection. The server pushes real-time events
        including AI log updates (every second), summary updates (every minute),
        notifications, and alert events.
      responses:
        200:
          description: SSE stream opened
          content:
            text/event-stream:
              schema:
                type: string
                description: "Events: update, summary, notification, alert"

  # ============================
  # LOG EXTRAS
  # ============================
  /logs/view/ai/{id}:
    get:
      tags: [Logs, "HTML Page"]
      summary: View a specific AI log entry page
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: HTML page for the AI log entry
          content:
            text/html:
              schema:
                type: string
        404:
          description: Log not found
        500:
          description: Server error

  /logs/ai/{id}:
    get:
      tags: [Logs]
      summary: Get a specific AI log entry as JSON
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: AI log entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AILog"
        404:
          description: Log not found
        500:
          description: Server error

  /logs/api/ai/{id}/tags:
    put:
      tags: [Logs]
      summary: Update tags on an AI log entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: string
                  description: Array of HistoricalTag IDs
      responses:
        200:
          description: Tags updated
        404:
          description: Log not found
        500:
          description: Server error

  /logs/api/summary:
    get:
      tags: [Logs]
      summary: Get filtered AI summary logs
      parameters:
        - in: query
          name: modelName
          schema:
            type: string
        - in: query
          name: startDate
          schema:
            type: string
        - in: query
          name: endDate
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
      responses:
        200:
          description: Paginated AI summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      type: object
        500:
          description: Failed to fetch AI summaries.
