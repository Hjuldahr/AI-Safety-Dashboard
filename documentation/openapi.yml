          description: HTML content for the Documentation Page.
          content:
            text/html:
              schema:
                type: string
              example: "<html>...</html>"
  /api/docs:
    get:
      tags: [Documentation, "HTML Page"]
      summary: API Documentation Page
      description: Returns the HTML of the API Documentation Page.
      responses:
        200:
          description: HTML content for the API Documentation Page.
          content:
            text/html:
              schema:
                type: string
              example: "<html>...</html>"
  # ============================
  # ADMIN ROUTER
  # ============================
  /admin/users:
    get:
      tags: [Admin, "HTML Page"]
      summary: User management page
      description: Returns the HTML of the User Management page.
      responses:
        200:
          description: HTML content for the Users Page.
          content:
            text/html:
              schema:
                type: string
              example: "<html>...</html>"

  /admin/api/users:
    get:
      tags: [Admin]
      summary: Get list of users (no passwords)
      responses:
        200:
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        500:
          description: Server error

  /admin/api/users/{id}/roles:
    patch:
      tags: [Admin]
      summary: Update a user's role
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
      responses:
        200:
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                      roles:
                        type: array
                        items:
                          type: string
        400:
          description: Invalid role or invalid request (e.g. changing own role)
        403:
          description: Forbidden (e.g. assigning owner role without permission)
        404:
          description: User not found
        500:
          description: Server error

  /admin/api/users/{id}:
    delete:
      tags: [Admin]
      summary: Delete a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        400:
          description: Bad request (e.g. attempting to delete own account)
        403:
          description: Forbidden (e.g. deleting owner without permission)
        404:
          description: User not found
        409:
          description: Conflict (e.g. cannot delete last owner)
        500:
          description: Server error

  /admin/api/roles:
    get:
      tags: [Admin]
      summary: List roles
      responses:
        200:
          description: Roles list
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        isSystemRole:
                          type: boolean
                        isCustom:
                          type: boolean
        500:
          description: Server error
    post:
      tags: [Admin]
      summary: Create a new role
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
      responses:
        201:
          description: Role created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  role:
                    type: object
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                      permissions:
                        type: array
                        items:
                          type: string
                      isCustom:
                        type: boolean
        400:
          description: Validation error (missing fields or invalid values)
        409:
          description: Role already exists
        500:
          description: Server error

  /admin/api/roles/{name}:
    delete:
      tags: [Admin]
      summary: Delete a role by name
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        200:
          description: Role deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        403:
          description: Forbidden (system roles cannot be deleted)
        404:
          description: Role not found
        409:
          description: Conflict (users still have this role)
        500:
          description: Server error

  /admin/api/permissions:
    get:
      tags: [Admin]
      summary: Get grouped available permissions
      responses:
        200:
          description: Permissions grouped by category
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                          label:
                            type: string
        500:
          description: Server error

  /admin/api/settings:
    get:
      tags: [Admin]
      summary: Get system settings
      responses:
        200:
          description: System settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiLogCutoff:
                    type: integer
                    description: AI log cutoff value in milliseconds
        500:
          description: Server error

  /admin/api/settings/ai-log-cutoff:
    put:
      tags: [Admin]
      summary: Update the AI log cutoff setting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
              properties:
                value:
                  type: number
                  description: Cutoff value in milliseconds (must be > 0)
      responses:
        200:
          description: Cutoff updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  aiLogCutoff:
                    type: number
        400:
          description: Invalid cutoff value
        500:
          description: Server error

  # ============================
  # PROFILE ROUTER
  # ============================
  /profile:
    get:
      tags: [Profile, "HTML Page"]
      summary: Profile page
      description: Returns the HTML of the Profile Page.
      responses:
        200:
          description: HTML content for the Profile Page.
          content:
            text/html:
              schema:
                type: string
              example: "<html>...</html>"
        500:
          description: Server error

  /api/profile/password:
    post:
      tags: [Profile]
      summary: Change current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        200:
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        400:
          description: Missing fields or validation error (e.g. new password too short)
        401:
          description: Not authenticated
        403:
          description: Current password incorrect
        404:
          description: User not found
        500:
          description: Server error
  /api/profile/preferences:
    post:
      tags: [Profile]
      summary: Update user theme/colour preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preferredTheme:
                  type: string
                  enum: [default, ocean, sunset, viridian, sakura, cosmic, contrast, compact]
                preferredColour:
                  type: string
                  enum: [light, dark, auto]
      responses:
        200:
          description: Preferences updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  preferences:
                    type: object
                    properties:
                      preferredTheme:
                        type: string
                      preferredColour:
                        type: string
        400:
          description: Invalid theme or colour selection
        401:
          description: Not authenticated
        404:
          description: User not found
        500:
          description: Server error

  # ============================
  # TAG ROUTER
  # ============================
  /tags:
    get:
      tags: [Tags]
      summary: List all tags
      responses:
        200:
          description: Array of tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        name:
                          type: string
                        color:
                          type: string
        500:
          description: Failed to list tags.
    post:
      tags: [Tags]
      summary: Create a new tag
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                color:
                  type: string
                  default: "#888888"
      responses:
        201:
          description: Tag created
          content:
            application/json:
              schema:
                type: object
                properties:
                  tag:
                    type: object
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      color:
                        type: string
        200:
          description: Tag already exists (returns existing)
        500:
          description: Failed to create tag.

  /tags/sync:
    post:
      tags: [Tags]
      summary: Sync tag list (create, update, delete in batch)
      description: Position-based sync of the full tag list. Handles renames, new tags, and deletions in a single request.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                originalIds:
                  type: array
                  items:
                    type: string
                  description: Array of existing tag IDs (positional)
                newNames:
                  type: array
                  items:
                    type: string
                  description: Array of tag names (positional, matching originalIds)
                colors:
                  type: array
                  items:
                    type: string
                  description: Array of tag colors (positional)
                deletions:
                  type: array
                  items:
                    type: string
                  description: Array of tag IDs to delete
      responses:
        200:
          description: Updated tag list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: object
        400:
          description: Invalid input
        500:
          description: Failed to sync tags.

  /tags/hist:
    get:
      tags: [Tags]
      summary: List all historical tags
      responses:
        200:
          description: Array of historical tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        name:
                          type: string
                        color:
                          type: string
                        originalTagId:
                          type: string
        500:
          description: Failed to list tags.

  /tags/hist/{id}:
    get:
      tags: [Tags]
      summary: Find a historical tag by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        201:
          description: Historical tag found
          content:
            application/json:
              schema:
                type: object
                properties:
                  tag:
                    type: object
        404:
          description: Historical Tag not found.
        500:
          description: Failed to find historical tag.

  # ============================
  # NOTIFICATION ROUTER
  # ============================
  /notifications/latest:
